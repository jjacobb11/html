<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Jacob Wong — Training Journal</title>
<style>
  :root {
    --bg: #0e0f11;
    --paper: #16181c;
    --card: #1c1f25;
    --ink: #e8e6e0;
    --ink-soft: #9b9890;
    --ink-mute: #5a5855;
    --line: rgba(255,255,255,0.08);
    --line-bright: rgba(255,255,255,0.15);

    --klscm: #e0664a;
    --klscm-soft: rgba(224,102,74,0.14);
    --shanghai: #5aa8d8;
    --shanghai-soft: rgba(90,168,216,0.14);

    --easy: #5ecb9e;
    --easy-soft: rgba(94,203,158,0.13);
    --tempo: #f0b050;
    --tempo-soft: rgba(240,176,80,0.13);
    --threshold: #f0784a;
    --threshold-soft: rgba(240,120,74,0.13);
    --interval: #b088f0;
    --interval-soft: rgba(176,136,240,0.13);
    --vo2: #f06090;
    --vo2-soft: rgba(240,96,144,0.13);
    --long: #5ab0ef;
    --long-soft: rgba(90,176,239,0.13);
    --rest: #6a675f;
    --rest-soft: rgba(255,255,255,0.04);

    --warn: #f0b050;
    --warn-soft: rgba(240,176,80,0.12);
    --bad: #f0784a;
    --bad-soft: rgba(240,120,74,0.12);
    --good: #5ecb9e;
    --good-soft: rgba(94,203,158,0.12);

    --accent: #d9a679;

    --serif: Georgia, 'Iowan Old Style', serif;
    --sans: -apple-system, 'Helvetica Neue', sans-serif;
    --mono: 'SF Mono', 'IBM Plex Mono', monospace;

    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
    overscroll-behavior-y: none;
    padding-bottom: calc(64px + var(--safe-bottom));
  }

  /* Fallback message shown if JS fails to boot */
  #bootError {
    display: none;
    padding: 60px 24px;
    text-align: center;
  }
  #bootError.show { display: block; }
  #bootError h2 { font-family: var(--serif); font-size: 20px; margin-bottom: 12px; }
  #bootError p { font-size: 14px; color: var(--ink-soft); line-height: 1.7; }

  noscript {
    display: block;
    padding: 60px 24px;
    text-align: center;
    font-size: 14px;
    color: var(--ink-soft);
  }

  /* ============ TOP BAR ============ */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    padding: calc(14px + var(--safe-top)) 18px 12px;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
  }
  .topbar .id .name { font-family: var(--serif); font-size: 16px; font-weight: 600; }
  .topbar .id .tag { font-size: 10px; color: var(--ink-mute); letter-spacing: 0.3px; }
  .topbar .races { display: flex; gap: 6px; }
  .topbar .race-chip {
    font-family: var(--mono); font-size: 9.5px; padding: 4px 8px; border-radius: 20px;
    display: flex; align-items: center; gap: 4px; white-space: nowrap;
  }
  .topbar .race-chip .dot { width: 5px; height: 5px; border-radius: 50%; }

  /* ============ VIEWS ============ */
  .view { display: none; padding: 18px 16px 28px; min-height: 60vh; }
  .view.active { display: block; }

  .view-eyebrow { font-family: var(--mono); font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--ink-mute); margin-bottom: 6px; }
  .view-title { font-family: var(--serif); font-size: 24px; font-weight: 600; letter-spacing: -0.3px; line-height: 1.2; margin-bottom: 10px; }
  .view-lede { font-size: 13px; color: var(--ink-soft); margin-bottom: 20px; line-height: 1.65; }
  .view-lede strong { color: var(--ink); font-weight: 600; }
  .sub-title { font-family: var(--serif); font-size: 16px; font-weight: 600; margin: 24px 0 12px; letter-spacing: -0.1px; color: var(--ink); }
  .sub-title:first-of-type { margin-top: 0; }

  /* ============ HERO ============ */
  .hero {
    background: linear-gradient(165deg, #1a1d22, #121316);
    margin: -18px -16px 22px; padding: 26px 20px 22px;
    border-radius: 0 0 18px 18px;
    border-bottom: 1px solid var(--line);
  }
  .hero-eyebrow { font-family: var(--mono); font-size: 9.5px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--ink-mute); margin-bottom: 10px; }
  .hero h1 { font-family: var(--serif); font-size: 25px; font-weight: 600; letter-spacing: -0.4px; line-height: 1.2; }
  .hero h1 em { font-style: normal; color: var(--accent); }
  .hero-sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 12px; line-height: 1.65; }
  .hero-races { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
  .hero-race-card { border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.02); }
  .hero-race-card .hrc-date { font-family: var(--mono); font-size: 9px; color: var(--ink-mute); letter-spacing: 0.4px; }
  .hero-race-card .hrc-name { font-family: var(--serif); font-size: 14px; font-weight: 600; margin-top: 2px; }
  .hero-race-card .hrc-target { font-size: 10.5px; color: var(--ink-soft); text-align: right; }
  .hero-stats { display: flex; gap: 10px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
  .hero-stat { flex: 1; }
  .hero-stat .hs-val { font-family: var(--serif); font-size: 17px; font-weight: 600; color: var(--accent); }
  .hero-stat .hs-label { font-size: 9px; color: var(--ink-mute); margin-top: 1px; line-height: 1.3; }

  /* ============ COMPONENTS ============ */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 18px; }
  .stat-cell { background: var(--card); padding: 12px 13px; }
  .stat-cell .lbl { font-size: 9.5px; color: var(--ink-mute); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 4px; }
  .stat-cell .val { font-family: var(--serif); font-size: 17px; font-weight: 600; }
  .stat-cell .sub { font-size: 10px; color: var(--ink-mute); margin-top: 1px; }

  .note { padding: 11px 13px; border-radius: 0 8px 8px 0; margin-bottom: 8px; font-size: 12.5px; line-height: 1.6; }
  .note.info { background: var(--good-soft); border-left: 3px solid var(--good); color: var(--ink); }
  .note.warn { background: var(--warn-soft); border-left: 3px solid var(--warn); color: var(--ink); }
  .note.bad { background: var(--bad-soft); border-left: 3px solid var(--bad); color: var(--ink); }
  .note strong { font-weight: 600; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 15px; margin-bottom: 12px; }
  .card h4 { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-mute); margin-bottom: 8px; }
  .card p { font-size: 12.5px; color: var(--ink-soft); line-height: 1.6; }
  .card p strong { color: var(--ink); font-weight: 600; }
  .card p + p { margin-top: 6px; }

  .dl-row { display: flex; justify-content: space-between; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 12px; gap: 10px; }
  .dl-row:last-child { border-bottom: none; }
  .dl-row .k { color: var(--ink-soft); flex-shrink: 0; }
  .dl-row .v { font-weight: 600; color: var(--ink); text-align: right; }
  .dl-row .v.good { color: var(--good); } .dl-row .v.warn { color: var(--warn); } .dl-row .v.bad { color: var(--bad); }
  .dl-row .z { display: block; font-size: 10px; color: var(--ink-mute); font-weight: 400; margin-top: 1px; }

  /* Week pattern */
  .wk-table { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
  .wk-phase-label { font-family: var(--mono); font-size: 10px; color: var(--ink-mute); letter-spacing: 0.4px; margin: 14px 0 6px; text-transform: uppercase; }
  .wk-row { display: grid; grid-template-columns: 36px 1fr; gap: 8px; align-items: center; }
  .wk-day { font-family: var(--mono); font-size: 10px; color: var(--ink-mute); text-align: center; }
  .wk-cell { border-radius: 7px; padding: 8px 11px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--line); }
  .wk-cell.rest-cell { background: var(--rest-soft); }
  .wk-type { font-size: 9px; font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase; }
  .wk-detail { font-size: 10.5px; color: var(--ink-soft); text-align: right; }
  .wk-detail strong { color: var(--ink); display: block; font-size: 11.5px; }

  /* Calendar */
  .cal-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .cal-tabs::-webkit-scrollbar { display: none; }
  .cal-tab { flex-shrink: 0; font-family: var(--mono); font-size: 11px; padding: 7px 13px; border-radius: 18px; border: 1px solid var(--line); background: var(--card); color: var(--ink-soft); }
  .cal-tab.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  .legend { display: flex; flex-wrap: wrap; gap: 8px 12px; margin-bottom: 16px; }
  .leg-item { display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--ink-soft); }
  .leg-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

  .cal-month-hdr { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 2px; padding-bottom: 8px; border-bottom: 2px solid var(--line-bright); }
  .cal-month-name { font-family: var(--serif); font-size: 18px; font-weight: 600; }
  .cal-month-name em { font-style: normal; color: var(--klscm); }
  .cal-month-name.shanghai-phase em { color: var(--shanghai); }
  .cal-month-meta { font-size: 10px; color: var(--ink-mute); text-align: right; line-height: 1.5; }
  .cal-month-meta strong { color: var(--ink-soft); }

  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-top: 10px; }
  .cal-hdr { text-align: center; font-size: 8.5px; font-weight: 600; color: var(--ink-mute); letter-spacing: 0.3px; padding-bottom: 4px; }
  .cal-day {
    min-height: 76px; border-radius: 6px; padding: 4px 5px; background: var(--card);
    border: 1px solid var(--line); display: flex; flex-direction: column;
    justify-content: flex-start; gap: 1px; position: relative; overflow: hidden;
  }
  .cal-day.empty { background: transparent; border: none; }
  .cal-day.rest { background: var(--rest-soft); }
  .cal-day .dnum { font-family: var(--mono); font-size: 8px; color: var(--ink-mute); }
  .cal-day .dtag { font-size: 6.5px; font-weight: 700; letter-spacing: 0.2px; padding: 1px 3px; border-radius: 2px; text-transform: uppercase; width: fit-content; max-width: 100%; }
  .cal-day .dtitle { font-size: 7.8px; font-weight: 600; color: var(--ink); line-height: 1.25; margin-top: 1px; }
  .cal-day .dpace { font-size: 7.3px; color: var(--ink-soft); line-height: 1.2; font-family: var(--mono); }
  .cal-day .dwucd { font-size: 6.6px; color: var(--ink-mute); line-height: 1.2; margin-top: auto; }
  .cal-day.race-day { background: var(--ink); border-color: var(--accent); }
  .cal-day.race-day .dnum { color: rgba(232,230,224,0.5); }
  .cal-day.race-day .dtitle { color: var(--accent); font-size: 8.3px; }
  .cal-day:active { transform: scale(0.95); transition: transform 0.1s; }

  .pace-table { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin: 16px 0; }
  .pace-row { display: flex; justify-content: space-between; padding: 8px 13px; border-bottom: 1px solid var(--line); font-size: 11.5px; align-items: baseline; background: var(--card); }
  .pace-row:last-child { border-bottom: none; }
  .pace-row .pl { color: var(--ink-soft); }
  .pace-row .pv-wrap { text-align: right; }
  .pace-row .pv { font-family: var(--mono); font-weight: 600; color: var(--ink); font-size: 11.5px; }
  .pace-row .pz { font-size: 9.5px; color: var(--ink-mute); display: block; }

  /* Strength */
  .str-block { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 14px; }
  .str-hdr { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: rgba(255,255,255,0.03); border-bottom: 1px solid var(--line); }
  .str-hdr .day-chip { font-family: var(--mono); font-size: 10px; padding: 3px 8px; border-radius: 5px; background: rgba(217,166,121,0.16); color: var(--accent); font-weight: 600; flex-shrink: 0; }
  .str-hdr .str-title { font-family: var(--serif); font-size: 14px; font-weight: 600; }
  .str-hdr .str-sub { font-size: 9.5px; color: var(--ink-mute); margin-top: 1px; }
  .str-body { padding: 4px 14px; }
  .ex-row { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: flex-start; }
  .ex-row:last-child { border-bottom: none; }
  .ex-num { font-family: var(--mono); font-size: 10px; color: var(--ink-mute); width: 14px; flex-shrink: 0; padding-top: 1px; }
  .ex-name { font-size: 12px; font-weight: 600; color: var(--ink); line-height: 1.4; }
  .ex-sets { font-size: 10.5px; color: var(--ink-soft); margin-top: 1px; }
  .ex-why { font-size: 10px; color: var(--ink-mute); margin-top: 3px; line-height: 1.5; }
  .ex-flag { display: inline-block; font-size: 8px; font-weight: 700; padding: 1px 5px; border-radius: 3px; margin-left: 4px; vertical-align: 1px; }

  /* Injury */
  .inj-card { display: flex; gap: 10px; padding: 13px 14px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; background: var(--card); }
  .inj-level { flex-shrink: 0; width: 56px; }
  .inj-level .il-badge { display: block; font-size: 9px; font-weight: 700; padding: 4px 0; border-radius: 5px; text-align: center; }
  .inj-body { flex: 1; min-width: 0; }
  .inj-name { font-family: var(--serif); font-size: 13.5px; font-weight: 600; margin-bottom: 4px; line-height: 1.3; }
  .inj-cause { font-size: 11.5px; color: var(--ink-soft); line-height: 1.6; margin-bottom: 7px; }
  .inj-fix { font-size: 11px; color: var(--ink-soft); background: rgba(255,255,255,0.03); border-left: 2px solid var(--ink-mute); padding: 7px 10px; border-radius: 0 6px 6px 0; line-height: 1.6; }
  .inj-fix strong { color: var(--ink); }

  /* Timeline */
  .timeline { position: relative; padding-left: 22px; margin: 16px 0; }
  .timeline::before { content: ''; position: absolute; left: 6px; top: 5px; bottom: 5px; width: 1px; background: var(--line); }
  .tl-item { position: relative; padding-bottom: 18px; }
  .tl-item:last-child { padding-bottom: 0; }
  .tl-item::before { content: ''; position: absolute; left: -22px; top: 3px; width: 8px; height: 8px; border-radius: 50%; background: var(--bg); border: 2px solid var(--ink-mute); }
  .tl-item.key::before { border-color: var(--klscm); background: var(--klscm); }
  .tl-time { font-family: var(--mono); font-size: 9.5px; color: var(--ink-mute); letter-spacing: 0.3px; }
  .tl-title { font-size: 12.5px; font-weight: 600; color: var(--ink); margin: 2px 0 3px; }
  .tl-desc { font-size: 11.5px; color: var(--ink-soft); line-height: 1.6; }

  .chart-box { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 15px; margin-bottom: 16px; }
  .chart-box h4 { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-mute); margin-bottom: 10px; }

  /* ============ BOTTOM NAV ============ */
  .bottomnav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
    background: var(--paper); border-top: 1px solid var(--line);
    padding: 6px 2px calc(6px + var(--safe-bottom));
    display: flex; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .bottomnav::-webkit-scrollbar { display: none; }
  .nav-btn {
    flex: 1; min-width: 56px; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 5px 2px; border-radius: 8px; color: var(--ink-mute); background: none; border: none;
  }
  .nav-btn .nb-icon { width: 19px; height: 19px; }
  .nav-btn .nb-icon svg { width: 100%; height: 100%; stroke: currentColor; fill: none; stroke-width: 1.6; }
  .nav-btn .nb-label { font-size: 8.5px; font-weight: 500; letter-spacing: 0.1px; }
  .nav-btn.active { color: var(--accent); }
  .nav-btn.active .nb-icon svg { stroke-width: 1.9; }

  /* ============ DAY MODAL ============ */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100;
    display: none; align-items: flex-end;
  }
  .modal-backdrop.open { display: flex; }
  .modal-sheet {
    background: var(--paper); width: 100%; border-radius: 18px 18px 0 0;
    padding: 20px 20px calc(28px + var(--safe-bottom)); max-height: 80vh; overflow-y: auto;
    border-top: 1px solid var(--line-bright);
  }
  .modal-handle { width: 36px; height: 4px; background: var(--line-bright); border-radius: 2px; margin: 0 auto 18px; }
  .modal-date { font-family: var(--mono); font-size: 11px; color: var(--ink-mute); letter-spacing: 0.5px; }
  .modal-tag { display: inline-block; font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 5px; text-transform: uppercase; letter-spacing: 0.4px; margin: 8px 0 4px; }
  .modal-title { font-family: var(--serif); font-size: 21px; font-weight: 600; margin-bottom: 12px; line-height: 1.25; }
  .modal-row { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .modal-row:last-child { border-bottom: none; }
  .modal-row .mk { color: var(--ink-mute); }
  .modal-row .mv { font-family: var(--mono); color: var(--ink); font-weight: 600; text-align: right; }
  .modal-close { position: absolute; top: 16px; right: 16px; width: 28px; height: 28px; border-radius: 50%; background: var(--line); display: flex; align-items: center; justify-content: center; }
  .modal-close svg { width: 13px; height: 13px; stroke: var(--ink-soft); stroke-width: 2; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<noscript>
  This is an interactive training journal that requires JavaScript. Please enable JavaScript in your browser settings, or open this file in Safari/Chrome instead of a preview pane.
</noscript>

<div id="bootError">
  <h2>Couldn't load the journal</h2>
  <p id="bootErrorMsg">Something went wrong while starting the app. Try reopening this file directly in Safari (not AirDrop preview or Files app preview — use "Open in Safari").</p>
</div>

<div id="appRoot" style="display:none">
  <div class="topbar">
    <div class="id">
      <div class="name">Jacob Wong</div>
      <div class="tag">Training Journal</div>
    </div>
    <div class="races">
      <div class="race-chip" style="background:var(--klscm-soft);color:var(--klscm)"><span class="dot" style="background:var(--klscm)"></span>10.4</div>
      <div class="race-chip" style="background:var(--shanghai-soft);color:var(--shanghai)"><span class="dot" style="background:var(--shanghai)"></span>12.6</div>
    </div>
  </div>

  <div id="views-root"></div>

  <nav class="bottomnav" id="bottomNav"></nav>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-sheet" id="modalSheet">
      <div class="modal-handle"></div>
      <div class="modal-close" id="modalClose"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
      <div id="modalContent"></div>
    </div>
  </div>
</div>

<script id="dataScript">
// ============ NAV CONFIG ============
const NAV_ITEMS = [
  { id:'overview', label:'Overview', icon:'<path d="M3 12l9-9 9 9M5 10v10h14V10"/>' },
  { id:'calendar', label:'Calendar', icon:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>' },
  { id:'form', label:'Form', icon:'<circle cx="12" cy="5" r="2"/><path d="M12 7v6l-4 8M12 13l4 8M12 13l-5-2M12 13l5-2"/>' },
  { id:'injury', label:'Injury', icon:'<path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7l8-4z"/><path d="M12 8v4M12 16h.01"/>' },
  { id:'strength', label:'Strength', icon:'<path d="M4 12h2M18 12h2M6 8v8M18 8v8M9 12h6M9 9v6M15 9v6"/>' },
  { id:'core', label:'Core', icon:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/>' },
  { id:'data', label:'Data', icon:'<path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/>' },
  { id:'recovery', label:'Recovery', icon:'<path d="M12 21s-7-4.5-9.5-9C1 8 3 4 7 4c2 0 4 1.5 5 3 1-1.5 3-3 5-3 4 0 6 4 4.5 8-2.5 4.5-9.5 9-9.5 9z"/>' },
];

function weekPattern(rows) {
  return rows.map(([day, type, title, pace]) => {
    const s = TYPE_STYLE[type];
    const cellCls = type === 'rest' ? 'wk-cell rest-cell' : 'wk-cell';
    const bgStyle = type !== 'rest' ? `style="background:${s.bg}"` : '';
    return `
    <div class="wk-row">
      <div class="wk-day">${day}</div>
      <div class="${cellCls}" ${bgStyle}>
        <span class="wk-type" style="color:${s.c}">${s.label}</span>
        <span class="wk-detail"><strong>${title}</strong>${pace}</span>
      </div>
    </div>`;
  }).join('');
}

// cell = [type, title, pace, wuCd, zone]
function dayCellHTML(num, cell) {
  if (!cell) return `<div class="cal-day empty"></div>`;
  const [type, title, pace, wuCd, zone] = cell;
  const s = TYPE_STYLE[type];
  const cls = s.cellClass ? `cal-day ${s.cellClass}` : 'cal-day';
  const bgStyle = s.bg ? `style="background:${s.bg}"` : '';
  const esc = (str) => (str||'').replace(/"/g,'&quot;');
  const dataAttr = `data-type="${type}" data-title="${esc(title)}" data-pace="${esc(pace)}" data-wucd="${esc(wuCd)}" data-zone="${esc(zone)}" data-num="${num}"`;

  const paceLine = (pace && pace !== '—') ? `<span class="dpace">${pace}</span>` : '';
  const wucdLine = wuCd ? `<span class="dwucd">${wuCd}</span>` : '';

  return `<div class="${cls}" ${bgStyle} ${dataAttr}>
    <span class="dnum">${num}</span>
    <span class="dtag" style="background:${s.c}25;color:${s.c}">${s.label}</span>
    ${paceLine}
    ${wucdLine}
  </div>`;
}

function renderMonthBody(idx) {
  const m = MONTHS[idx];
  const dow = ['M','T','W','T','F','S','S'];
  let cells = '';
  for (let i=0;i<m.leadBlanks;i++) cells += dayCellHTML(null,null);
  for (let d=1; d<=m.days; d++) {
    const c = m.cells[d];
    if (!c) { cells += dayCellHTML(d, ['rest','Rest Day','—','','']); continue; }
    cells += dayCellHTML(d, c);
  }
  const insightsHtml = m.insights.map(([level,title,desc]) =>
    `<div class="note ${level}"><strong>${title}:</strong> ${desc}</div>`
  ).join('');
  const paceHtml = m.paceRef.map(([l,v,z]) =>
    `<div class="pace-row"><span class="pl">${l}</span><span class="pv-wrap"><span class="pv">${v}</span><span class="pz">${z}</span></span></div>`
  ).join('');
  const emClass = m.emClass || '';

  return `
    <div class="cal-month-hdr">
      <div class="cal-month-name ${emClass}">${m.name}</div>
      <div class="cal-month-meta"><strong>${m.phase}</strong><br>${m.meta}</div>
    </div>
    <div class="cal-grid">
      ${dow.map(d=>`<div class="cal-hdr">${d}</div>`).join('')}
      ${cells}
    </div>
    <div class="pace-table">${paceHtml}</div>
    ${insightsHtml}
  `;
}

const VIEWS = {
  overview: viewOverview, calendar: viewCalendar, form: viewForm, injury: viewInjury,
  strength: viewStrength, core: viewCore, data: viewData, recovery: viewRecovery
};

// ============ APP STATE ============
let currentView = 'overview';
let currentMonth = 0;

function renderNav() {
  const nav = document.getElementById('bottomNav');
  nav.innerHTML = NAV_ITEMS.map(item => `
    <button class="nav-btn${item.id===currentView?' active':''}" data-view="${item.id}">
      <span class="nb-icon"><svg viewBox="0 0 24 24">${item.icon}</svg></span>
      <span class="nb-label">${item.label}</span>
    </button>
  `).join('');
  nav.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => switchView(btn.dataset.view));
  });
}

function switchView(id) {
  currentView = id;
  const root = document.getElementById('views-root');
  root.innerHTML = `<div class="view active">${VIEWS[id]()}</div>`;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === id));
  window.scrollTo(0, 0);

  if (id === 'calendar') {
    initCalendarTabs();
    renderCalendarMonth(currentMonth);
  }
  if (id === 'data') {
    renderDataChart();
  }
}

function initCalendarTabs() {
  document.querySelectorAll('.cal-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      currentMonth = parseInt(tab.dataset.month, 10);
      document.querySelectorAll('.cal-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      renderCalendarMonth(currentMonth);
    });
  });
}

function renderCalendarMonth(idx) {
  const body = document.getElementById('calMonthBody');
  body.innerHTML = renderMonthBody(idx);
  attachDayHandlers();
}

function attachDayHandlers() {
  document.querySelectorAll('.cal-day:not(.empty)').forEach(cell => {
    cell.addEventListener('click', () => openDayModal(cell.dataset));
  });
}

// ---- Day detail modal (tap for full session info) ----
function openDayModal(d) {
  const { type, title, pace, wucd, zone, num } = d;

  document.getElementById('modalContent').innerHTML = `

  document.getElementById('modalBackdrop').classList.remove('open');
}

// ---- Data chart: dependency-free inline SVG ----
function renderDataChart() {
  const el = document.getElementById('cadChartSvg');
  if (!el) return;
  const labels = ['Easy', 'Fartlek', 'Interval', 'Threshold', 'VO2max'];
  const cad = [82, 87, 88, 89, 94];
  const pwr = [195, 223, 220, 255, 279];
  const cadMin = 75, cadMax = 100, pwrMin = 150, pwrMax = 320;
  const W = 320, H = 180, padL = 14, padR = 14, padB = 22, padT = 10;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const n = labels.length;
  const groupW = plotW / n;
  const barW = groupW * 0.3;

  let bars = '';
  labels.forEach((lab, i) => {
    const gx = padL + i * groupW;
    const cadH = (cad[i] - cadMin) / (cadMax - cadMin) * plotH;
    const pwrH = (pwr[i] - pwrMin) / (pwrMax - pwrMin) * plotH;
    const cadX = gx + groupW * 0.18;
    const pwrX = gx + groupW * 0.52;
    bars += `<rect x="${cadX}" y="${padT + plotH - cadH}" width="${barW}" height="${cadH}" fill="#5aa8d8" rx="2"/>`;
    bars += `<rect x="${pwrX}" y="${padT + plotH - pwrH}" width="${barW}" height="${pwrH}" fill="#f0b050" rx="2"/>`;
    bars += `<text x="${gx + groupW/2}" y="${H - 5}" font-size="8.5" fill="#9b9890" text-anchor="middle">${lab}</text>`;
  });

  el.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
      <line x1="${padL}" y1="${padT+plotH}" x2="${W-padR}" y2="${padT+plotH}" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      ${bars}
    </svg>
    <div style="display:flex;gap:14px;justify-content:center;margin-top:6px">
      <span style="font-size:10px;color:#9b9890;display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:2px;background:#5aa8d8;display:inline-block"></span>Cadence spm</span>
      <span style="font-size:10px;color:#9b9890;display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:2px;background:#f0b050;display:inline-block"></span>Power W</span>
    </div>
  `;
}

// ============ BOOT ============
renderNav();
switchView('overview');
document.getElementById('modalClose').addEventListener('click', closeDayModal);
document.getElementById('modalBackdrop').addEventListener('click', function(e) {
  if (e.target.id === 'modalBackdrop') closeDayModal();
});

  document.getElementById('appRoot').style.display = 'block';
} catch (err) {
  document.getElementById('bootError').className = 'show';
  document.getElementById('bootErrorMsg').textContent = 'Error: ' + err.message;
  if (window.console) console.error(err);
}
</script>
